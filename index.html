<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="description" content="ModelHub 模型资源检索与网盘转存">
  <title>ModelHub 模型资源库</title>
  <link rel="stylesheet" href="style.css?v=20260906-pagesize">
</head>
<body>
  <div class="page-glow page-glow-left" aria-hidden="true"></div>
  <div class="page-glow page-glow-right" aria-hidden="true"></div>

  <div id="app" class="app-shell">
    <header class="header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <div>
          <p class="brand-kicker">MODEL RESOURCE CENTER</p>
          <h1 class="header-title">ModelHub 模型资源库</h1>
        </div>
      </div>
      <div class="header-sync" id="syncStatus" aria-live="polite">同步中...</div>
    </header>

    <main>
      <section class="search-panel" aria-label="搜索模型资源">
        <div class="search-copy">
          <span class="search-label">查找模型</span>
          <span class="search-description">多个关键词用空格分隔，结果会按匹配度排列</span>
        </div>

        <div class="search-bar">
          <div class="search-input-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="7.5"></circle>
              <path d="m20 20-3.7-3.7"></path>
            </svg>
            <input
              type="search"
              id="searchInput"
              class="search-input"
              placeholder="输入多个关键词，空格分隔，例如 wan lora fp16"
              autocomplete="off"
              enterkeyhint="search"
              aria-label="搜索模型文件"
            >
            <span class="search-shortcut" aria-hidden="true">/</span>
            <button id="clearBtn" class="search-clear" type="button" hidden aria-label="清除搜索">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="m8 8 8 8M16 8l-8 8"></path>
              </svg>
            </button>
          </div>
        </div>

        <div class="results-summary">
          <div class="stats-bar" id="statsBar" aria-live="polite">加载中...</div>
        </div>
      </section>

      <section class="content-section" aria-label="模型资源列表">
        <div class="loading state-panel" id="loading">
          <div class="spinner"></div>
          <p>正在加载模型资源...</p>
        </div>

        <div class="error-state state-panel" id="errorState" hidden>
          <div class="state-icon state-icon-error">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 7.5v5M12 16.5h.01"/>
            </svg>
          </div>
          <h2>资源加载失败</h2>
          <p id="errorMsg">加载失败</p>
          <button class="btn-primary" id="retryBtn" type="button">重新加载</button>
        </div>

        <div class="empty-state state-panel" id="emptyState" hidden>
          <div class="state-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path d="M4 7.5h16M7 4h10a2 2 0 0 1 2 2v14H5V6a2 2 0 0 1 2-2Z"/>
              <path d="M9 12h6M10 16h4"/>
            </svg>
          </div>
          <h2>没有匹配的模型</h2>
          <p id="emptyMsg">暂无文件记录</p>
        </div>

        <div class="file-list" id="fileList" hidden></div>
        <div id="pagination" class="pagination-wrap" aria-label="分页"></div>
      </section>
    </main>

    <footer class="footer">
      <span>ModelHub</span>
      <span>模型资源聚合与快速检索</span>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js?v=20260906-pagesize"></script>
</body>
</html>
